<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Multi-Factor Authentication</title>
    <link rel="icon" type="images/x-icon" href="Images/MClogo.png">

    <script src="main.js" defer></script>
</head>
<body>
    
    <div id="box-parent">
        <div id="box-outer">
            <div id="box-inner">
                    <div id="logo-format">
                        <img src="Images/MClogo.png" alt="Microsoft Logo" height="50" width="50">
                        <h2> Microsoft</h2>
                    </div>
                <h1>Enter code</h1>
                <p class="paragraph" id="sent-a-code">We just sent a code to +1 123-456-7891</p>
                <input type="text" placeholder="Enter code">
                <div id="button-format">
                    <a href="" class="button-look" id="sign-in">Sign in</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
